name: Frontend Lint (ESLint)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: Run ESLint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Node.js
        uses: actions/setup-node@1d0ff469b7ec7b3ea9d8d6457193910543666f7f # v4.2.0
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/Dify-ChatBot-V2/package-lock.json

      - name: Install dependencies
        run: |
          cd frontend/Dify-ChatBot-V2
          npm ci

      - name: Run ESLint and Export Report
        run: |
          cd frontend/Dify-ChatBot-V2
          set -o pipefail
          npm run lint 2>&1 | tee eslint-report.txt

      - name: Upload ESLint Report
        uses: actions/upload-artifact@0b2256b8c012f0874dc3919b9ab1d47786821213 # v4.3.0
        if: always()
        with:
          name: eslint-report
          path: frontend/Dify-ChatBot-V2/eslint-report.txt
          retention-days: 7
